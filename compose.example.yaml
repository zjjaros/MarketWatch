services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
      POSTGRES_DB: marketwatch
    volumes:
      - postgres_data:/var/lib/postgresql
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:your_password_here@postgres:5432/marketwatch
  collector:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:your_password_here@postgres:5432/marketwatch
    command: uv run python -m collector.main
volumes:
  postgres_data: