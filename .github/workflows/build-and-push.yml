
name: Build, Push, and Deploy MarketWatch

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: marketwatch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::997956187142:role/MarketWatchGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Find EC2 instances and database secrets
        shell: bash
        run: |
          set -euo pipefail

          find_instance() {
            local name="$1"
            local info

            info="$(aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:Name,Values=$name" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].[InstanceId,Tags[?Key=='RDSSecretArn'].Value | [0]]" \
              --output text)"

            if [[ -z "$info" || "$info" == "None" ]]; then
              echo "ERROR: Could not find running instance: $name" >&2
              return 1
            fi

            local instance_id secret_arn
            read -r instance_id secret_arn <<< "$info"

            if [[ -z "$instance_id" || -z "$secret_arn" || "$secret_arn" == "None" ]]; then
              echo "ERROR: Missing instance ID or RDSSecretArn tag for $name" >&2
              return 1
            fi

            printf '%s\t%s\n' "$instance_id" "$secret_arn"
          }

          API_INFO="$(find_instance marketwatch-api)"
          COLLECTOR_INFO="$(find_instance marketwatch-collector)"

          echo "API_INSTANCE_ID=$(cut -f1 <<< "$API_INFO")" >> "$GITHUB_ENV"
          echo "API_DB_SECRET_ARN=$(cut -f2 <<< "$API_INFO")" >> "$GITHUB_ENV"
          echo "COLLECTOR_INSTANCE_ID=$(cut -f1 <<< "$COLLECTOR_INFO")" >> "$GITHUB_ENV"
          echo "COLLECTOR_DB_SECRET_ARN=$(cut -f2 <<< "$COLLECTOR_INFO")" >> "$GITHUB_ENV"

      - name: Deploy API through SSM
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_B64="$(base64 -w 0 scripts/deploy-ec2.sh)"
          COMPOSE_B64="$(base64 -w 0 compose.api.yaml)"

          jq -n \
            --arg script "$SCRIPT_B64" \
            --arg compose "$COMPOSE_B64" \
            --arg secret "$API_DB_SECRET_ARN" \
            '{
              commands: [
                "set -eu",
                "mkdir -p /opt/marketwatch",
                ("printf %s " + ($script | @sh) + " | base64 -d > /opt/marketwatch/deploy-ec2.sh"),
                ("printf %s " + ($compose | @sh) + " | base64 -d > /opt/marketwatch/compose.api.yaml"),
                "chmod 700 /opt/marketwatch/deploy-ec2.sh",
                ("export DB_SECRET_ARN=" + ($secret | @sh) + " && /opt/marketwatch/deploy-ec2.sh")
              ]
            }' > ssm-parameters.json

          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$API_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MarketWatch API from GitHub Actions" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)"

          bash scripts/wait-for-ssm.sh "$COMMAND_ID" "$API_INSTANCE_ID" "$AWS_REGION"

      - name: Deploy collector through SSM
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_B64="$(base64 -w 0 scripts/deploy-collector-ec2.sh)"
          COMPOSE_B64="$(base64 -w 0 compose.collector.yaml)"

          jq -n \
            --arg script "$SCRIPT_B64" \
            --arg compose "$COMPOSE_B64" \
            --arg secret "$COLLECTOR_DB_SECRET_ARN" \
            '{
              commands: [
                "set -eu",
                "mkdir -p /opt/marketwatch",
                ("printf %s " + ($script | @sh) + " | base64 -d > /opt/marketwatch/deploy-collector-ec2.sh"),
                ("printf %s " + ($compose | @sh) + " | base64 -d > /opt/marketwatch/compose.collector.yaml"),
                "chmod 700 /opt/marketwatch/deploy-collector-ec2.sh",
                ("export DB_SECRET_ARN=" + ($secret | @sh) + " && /opt/marketwatch/deploy-collector-ec2.sh")
              ]
            }' > ssm-parameters.json

          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$COLLECTOR_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MarketWatch collector from GitHub Actions" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)"

          bash scripts/wait-for-ssm.sh "$COMMAND_ID" "$COLLECTOR_INSTANCE_ID" "$AWS_REGION"